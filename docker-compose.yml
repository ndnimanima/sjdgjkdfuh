services:
  rozaneh:
    build:
      context: .
      dockerfile: Dockerfile
    image: rozaneh:1.06
    container_name: rozaneh
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      PORT: 8080
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - rozaneh_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s

volumes:
  rozaneh_data:
    name: rozaneh_data
