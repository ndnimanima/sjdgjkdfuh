<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Rozaneh">
  <defs>
    <linearGradient id="rz-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d2f4c"/>
      <stop offset="1" stop-color="#080e1b"/>
    </linearGradient>
    <linearGradient id="rz-light" x1="16" y1="50" x2="50" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset=".52" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <clipPath id="rz-arch">
      <path d="M20 51V30.5a12 12 0 0 1 24 0V51z"/>
    </clipPath>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#rz-bg)"/>
  <rect x=".65" y=".65" width="62.7" height="62.7" rx="15.35" fill="none"
        stroke="#2dd4bf" stroke-opacity=".26" stroke-width="1.3"/>

  <!-- the opening -->
  <g clip-path="url(#rz-arch)">
    <rect x="16" y="14" width="32" height="40" fill="url(#rz-light)"/>
    <!-- light beam crossing the opening -->
    <path d="M15 47 45 15h9L24 47z" fill="#ffffff" fill-opacity=".3"/>
    <path d="M15 39 37 15h6L21 39z" fill="#ffffff" fill-opacity=".16"/>
  </g>

  <!-- sill -->
  <rect x="16.5" y="51" width="31" height="3.4" rx="1.7" fill="url(#rz-light)"/>
  <path d="M20 51V30.5a12 12 0 0 1 24 0V51" fill="none" stroke="#0a1120" stroke-opacity=".28" stroke-width="1.1"/>

  <!-- spark -->
  <circle cx="47.5" cy="16.5" r="2.4" fill="#fffdf6" fill-opacity=".95"/>
</svg>
