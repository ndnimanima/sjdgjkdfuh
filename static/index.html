<!doctype html>
<html lang="fa" dir="rtl" data-theme="slate">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>روزنه · Rozaneh</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <link rel="stylesheet" href="/assets/style.css?v=1.04"/>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="/assets/logo.svg" alt="Rozaneh"/>
        <div class="brand-txt">
          <div class="brand-title" id="brandTitle">روزنه</div>
          <div class="brand-sub">
            <span>Rozaneh Studio</span>
            <span class="ver-pill mono" id="verBadge">v1.04</span>
          </div>
        </div>
      </div>

      <nav class="nav" id="nav"></nav>

      <div class="side-foot">
        <div class="side-live">
          <span class="pulse" id="liveDot"></span>
          <span id="liveTxt">موتور زمان‌بندی فعال</span>
        </div>
        <div class="side-actions">
          <span class="mono" id="verFoot">v1.04</span>
          <button class="btn btn-sm btn-ghost" id="logoutBtn" type="button">خروج</button>
        </div>
      </div>
    </aside>

    <div class="shell">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" type="button" aria-label="Menu">☰</button>
        <div class="page-head">
          <h1 class="page-title" id="pageTitle">پیشخوان فرماندهی</h1>
          <p class="page-sub" id="pageSub"></p>
        </div>
        <div class="top-tools">
          <button class="btn btn-sm btn-primary" id="quickAnalyzeBtn" type="button">✨ تحلیل لینک</button>
          <div class="theme-switch" id="themeSwitch" role="group" aria-label="Theme">
            <button class="theme-dot" data-t="slate"   type="button" title="Aurora Dark · شفق تیره"></button>
            <button class="theme-dot" data-t="cyber"   type="button" title="Cyber Obsidian · نئون سایبری"></button>
            <button class="theme-dot" data-t="emerald" type="button" title="Persian Emerald · زمرد پارسی"></button>
            <button class="theme-dot" data-t="amber"   type="button" title="Silk Daylight · روزنه روشن"></button>
          </div>
          <button class="btn btn-sm" id="langBtn" type="button">EN</button>
          <button class="btn btn-sm" id="refreshBtn" type="button">↻</button>
        </div>
      </header>

      <main class="content" id="main">
        <div id="view"><div class="empty" id="bootMsg">…</div></div>
      </main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div class="toasts" id="toastRoot"></div>

  <script src="/assets/i18n.js?v=1.04"></script>
  <script src="/assets/app.js?v=1.04"></script>
</body>
</html>
