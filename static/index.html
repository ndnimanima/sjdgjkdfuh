<!doctype html>
<html lang="fa" dir="rtl" data-theme="slate">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>روزنه · Rozaneh</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <link rel="stylesheet" href="/assets/style.css?v=1.06"/>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="/assets/logo.svg" alt="Rozaneh"/>
        <div class="brand-txt">
          <div class="brand-title" id="brandTitle">روزنه</div>
          <div class="brand-sub">
            <span>Rozaneh Studio</span>
            <span class="ver-pill mono" id="verBadge">v1.06</span>
          </div>
        </div>
      </div>

      <nav class="nav" id="nav"></nav>

      <div class="side-foot">
        <div class="side-live">
          <span class="pulse" id="liveDot"></span>
          <span id="liveTxt">موتور زمان‌بندی فعال</span>
        </div>
        <div class="side-actions">
          <span class="mono" id="verFoot">v1.06</span>
          <button class="btn btn-sm btn-ghost" id="logoutBtn" type="button">خروج</button>
        </div>
      </div>
    </aside>

    <div class="shell">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" type="button" aria-label="Menu">☰</button>
        <div class="page-head">
          <h1 class="page-title" id="pageTitle">پیشخوان فرماندهی</h1>
          <p class="page-sub" id="pageSub"></p>
        </div>
        <div class="top-tools">
          <button class="btn btn-sm btn-primary" id="quickAnalyzeBtn" type="button">✨ تحلیل لینک</button>
          <div class="theme-switch" id="themeSwitch">
            <button class="btn btn-sm theme-trigger" id="themeToggle" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Choose theme" title="Choose theme">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18h1.2a2 2 0 0 0 1.5-3.3 1.9 1.9 0 0 1 1.5-3.1h.8A4 4 0 0 0 21 10.7 7.7 7.7 0 0 0 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7.5" r="1"/><circle cx="15" cy="8" r="1"/></svg>
            </button>
            <div class="theme-popover" id="themePopover" role="group" aria-label="Choose theme" hidden>
              <button class="theme-choice" data-t="slate" type="button" title="Aurora Dark · شفق تیره"><span class="theme-dot"></span><span>Aurora</span></button>
              <button class="theme-choice" data-t="cyber" type="button" title="Cyber Obsidian · نئون سایبری"><span class="theme-dot"></span><span>Cyber</span></button>
              <button class="theme-choice" data-t="emerald" type="button" title="Persian Emerald · زمرد پارسی"><span class="theme-dot"></span><span>Emerald</span></button>
              <button class="theme-choice" data-t="amber" type="button" title="Silk Daylight · روزنه روشن"><span class="theme-dot"></span><span>Silk</span></button>
            </div>
          </div>
          <button class="btn btn-sm" id="langBtn" type="button">EN</button>
          <button class="btn btn-sm" id="refreshBtn" type="button">↻</button>
        </div>
      </header>

      <main class="content" id="main">
        <div id="view"><div class="empty" id="bootMsg">…</div></div>
      </main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div class="toasts" id="toastRoot"></div>

  <script src="/assets/i18n.js?v=1.06"></script>
  <script src="/assets/app.js?v=1.06"></script>
</body>
</html>
